
services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: usage_event_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_password_change_me}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d usage_event_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD:-local_dev_password_change_me}@db:5432/usage_event_db
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-local-development-secret-key-change-before-submission}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
